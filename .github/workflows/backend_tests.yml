name: Backend Tests

on:
  - push
  - pull_request

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os:
          - ubuntu-latest
        python-version:
          - '3.10'

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install specific TensorFlow and Pillow wheels
        run: |
          pip install https://files.pythonhosted.org/packages/74/c3/c222baff1e49dd9ac42788dfcad0b16ac574a25db0d85a9c64c703bd8fbe/tensorflow-2.9.2-cp310-cp310-manylinux_2_17_x86_64.manylinux2014_x86_64.whl
          pip install https://files.pythonhosted.org/packages/95/7b/71e2665760b5c33af00fa9bb6d6bca068b51bf021a4ceaeee03e18689f51/Pillow-10.1.0-cp310-cp310-manylinux_2_17_x86_64.manylinux2014_x86_64.whl

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools>=80.9.0
          pip install -r requirements.txt

      - name: Install current package
        run: pip install .

      - name: Run backend tests
        run: pytest
